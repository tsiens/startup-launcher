name: Startup Launcher Tag Listener
run-name: Detect tag ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  dispatch-release:
    name: Start release build
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag metadata
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Dispatch release build with tag content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Tag must use vX.Y.Z format, got: $RELEASE_TAG" >&2
            exit 1
          }
          message="$(git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents)')"
          [[ -n "$message" ]] || {
            echo "Tag $RELEASE_TAG must be annotated with functional differences" >&2
            exit 1
          }
          run_name="$(printf '%s\n' "$message" | sed -E '/^[[:space:]]*$/d; s/^[[:space:]]*-[[:space:]]*//' | awk 'NR == 1 { printf "%s", $0; next } { printf " · %s", $0 }')"
          [[ -n "$run_name" ]] || {
            echo "Could not summarize tag annotation for $RELEASE_TAG" >&2
            exit 1
          }
          jq -n --arg tag "$RELEASE_TAG" --arg summary "$run_name" --arg body "$message" \
            '{event_type:"startup-launcher-release",client_payload:{tag:$tag,release_name:$summary,release_body:$body}}' \
            | curl --fail-with-body --silent --show-error \
                -X POST "https://api.github.com/repos/$REPOSITORY/dispatches" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H 'Accept: application/vnd.github+json' \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                -H 'Content-Type: application/json' \
                --data-binary @-
