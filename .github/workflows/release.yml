name: Release Startup Launcher
run-name: ${{ github.event.inputs.release_name || inputs.release_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to build
        required: true
        type: string
      release_name:
        description: Summary of all functional differences from the previous tag
        required: true
        type: string
      release_body:
        description: Full annotated tag content used as the release body
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: startup-launcher-release-${{ inputs.tag }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set build version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          RELEASE_BODY: ${{ inputs.release_body }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must use vX.Y.Z format, got: $tag"
          }
          if (-not $env:RELEASE_NAME) {
            throw "Tag $tag is missing the complete summary for the Action run name"
          }
          if (-not $env:RELEASE_BODY) {
            throw "Tag $tag is missing its annotated content"
          }
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "STARTUP_LAUNCHER_VERSION=$tag"

      - name: Build Windows executable
        run: cargo build --release --locked

      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'release' -Force | Out-Null
          Copy-Item -LiteralPath 'target/release/startup-launcher.exe' -Destination 'release/StartupLauncher.exe'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          body: ${{ inputs.release_body }}
          generate_release_notes: false
          files: release/StartupLauncher.exe
          overwrite_files: true
          fail_on_unmatched_files: true
