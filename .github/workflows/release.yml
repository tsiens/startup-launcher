name: Release Startup Launcher
run-name: ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: startup-launcher-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Set build version from tag
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Tag must use vX.Y.Z format, got: $tag"
          }
          $tagBody = (@(git for-each-ref "refs/tags/$tag" --format='%(contents)') -join "`n").TrimEnd("`r", "`n")
          if (-not $tagBody) {
            throw "Tag $tag is missing its annotated content"
          }
          $delimiter = [guid]::NewGuid().ToString('N')
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "release_body<<$delimiter"
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $tagBody
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value $delimiter
          Add-Content -LiteralPath $env:GITHUB_ENV -Value "STARTUP_LAUNCHER_VERSION=$tag"

      - name: Build Windows executable
        run: cargo build --release --locked

      - name: Prepare release asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'release' -Force | Out-Null
          Copy-Item -LiteralPath 'target/release/startup-launcher.exe' -Destination 'release/StartupLauncher.exe'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.version.outputs.release_body }}
          generate_release_notes: false
          files: release/StartupLauncher.exe
          overwrite_files: true
          fail_on_unmatched_files: true
